services:
  # Dịch vụ ứng dụng Node.js
  api:
    build: .
    env_file: .env
    command: ["sh", "-c", "npm run setup && npm start"]
    ports:
      - "${PORT:-8090}:8090"
    environment:
      - NODE_ENV=development
      - MAIL_TRANSPORT=dev
      - DOCKER_CONTAINER=true
      - DB_CONNECTION_STRING=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ban_ve_su_kien}
      - REDIS_URL=redis://redis:6379
      - PORT=8090
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8090}
      - ACTIVATION_CODE_TTL_SECONDS=${ACTIVATION_CODE_TTL_SECONDS:-600}
      - ACTIVATION_CODE_MAX_ATTEMPTS=${ACTIVATION_CODE_MAX_ATTEMPTS:-5}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-dev}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - MAIL_FROM=${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dịch vụ Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ban_ve_su_kien}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ban_ve_su_kien}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dịch vụ Cache Redis
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
