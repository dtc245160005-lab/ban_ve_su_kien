services:
  # Dịch vụ ứng dụng Node.js
  api:
    build: .
    env_file: .env
    command: ["sh", "-c", "npm run setup && npm start"]
    ports:
      - "${PORT:-8090}:8090"
    environment:
      - NODE_ENV=development
      - MAIL_TRANSPORT=dev
      - DOCKER_CONTAINER=true
      - DB_CONNECTION_STRING=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ban_ve_su_kien}
      - REDIS_URL=redis://redis:6379
      - PORT=8090
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dịch vụ Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ban_ve_su_kien}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ban_ve_su_kien}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dịch vụ Cache Redis
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
