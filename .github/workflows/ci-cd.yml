name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin


      - name: Run lint and test
        run: |
          npm run lint --if-present
          npm test --if-present

      - name: Run migrations
        env:
          DB_CONNECTION_STRING: postgres://postgres:mysecretpassword@localhost:5432/postgres
        run: |
          npm run migrate:latest
          npm run migrate:rollback