<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý nhân viên</title><link rel="stylesheet" href="./styles.css"></head><body>
<main class="auth-shell"><section class="auth-card workspace-card"><div class="brand-block"><div class="brand-icon">A</div><h1>Quản lý nhân viên</h1><p>Chỉ quản trị viên được tạo tài khoản và phân vai trò</p></div>
<form id="staffForm" class="auth-form"><div class="field-group"><label for="fullName">Họ tên</label><input id="fullName" name="fullName" required maxlength="100"></div><div class="field-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field-group"><label for="password">Mật khẩu ban đầu</label><input id="password" name="password" type="password" minlength="8" maxlength="128" required></div><fieldset class="role-picker"><legend>Vai trò</legend><label><input type="checkbox" name="roles" value="organizer"> Ban tổ chức</label><label><input type="checkbox" name="roles" value="checker"> Soát vé</label><label><input type="checkbox" name="roles" value="accountant"> Kế toán</label></fieldset><div id="staffMessage" class="message" hidden></div><button class="primary-btn" type="submit">Tạo nhân viên</button></form>
<h2>Danh sách nhân viên</h2><div id="staffList" class="menu-list"></div><p class="footer-text"><a href="/app.html">Quay lại trang chính</a></p></section></main><script src="./api.js"></script><script src="./admin-staff.js"></script></body></html>
