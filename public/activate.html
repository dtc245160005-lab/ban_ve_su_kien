<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác nhận tài khoản</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="activate-title">
        <div class="brand-block">
          <div class="brand-icon" aria-hidden="true">A</div>
          <h1 id="activate-title">Nhập mã xác nhận</h1>
          <p>Mã 6 số đã được gửi đến Gmail của bạn và có hiệu lực trong 10 phút.</p>
        </div>
        <form id="activateForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="activationEmail">Email</label>
            <input id="activationEmail" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field-group">
            <label for="activationCode">Mã xác nhận</label>
            <input id="activationCode" class="otp-input" name="code" type="text" inputmode="numeric"
              autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required />
            <div id="codeError" class="field-error" aria-live="polite"></div>
          </div>
          <div id="statusBox" class="message error" role="alert" aria-live="polite" hidden></div>
          <button id="activateButton" class="primary-btn" type="submit">Xác nhận</button>
          <button id="resendButton" class="secondary-btn" type="button">Gửi lại mã</button>
        </form>
        <p class="footer-text"><a href="/login.html">Quay lại đăng nhập</a></p>
      </section>
    </main>
    <script src="./activate.js" defer></script>
  </body>
</html>
