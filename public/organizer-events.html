<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý sự kiện</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <h1>Quản lý sự kiện</h1>
          <p id="accountSummary" class="muted" style="margin: 4px 0 0; font-size: 14px;">Đang tải...</p>
        </div>
        <div class="actions-row">
          <a href="/app.html" class="secondary-btn small-btn" style="text-decoration: none; text-align: center;">Trang chính</a>
          <button id="logoutBtn" type="button" class="secondary-btn small-btn">Đăng xuất</button>
        </div>
      </header>

      <div id="globalMessage" style="margin-bottom: 16px;"></div>

      <!-- VIEW 1: Danh sách sự kiện & Tạo sự kiện mới -->
      <div id="listView">
        <section class="card">
          <h2>Tạo sự kiện mới</h2>
          <form id="createEventForm" class="auth-form" novalidate>
            <div class="field-group">
              <label for="createTitle">Tên sự kiện *</label>
              <input id="createTitle" name="title" type="text" maxlength="200" placeholder="Nhập tên sự kiện" required />
              <span id="createTitleError" class="field-error"></span>
            </div>

            <div class="field-group">
              <label for="createVenue">Địa điểm *</label>
              <input id="createVenue" name="venue" type="text" maxlength="255" placeholder="Nhập địa điểm tổ chức" required />
              <span id="createVenueError" class="field-error"></span>
            </div>

            <div class="field-group">
              <label for="createDescription">Mô tả</label>
              <textarea id="createDescription" name="description" rows="3" maxlength="5000" placeholder="Mô tả sự kiện (tối đa 5000 ký tự)" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 14px; outline: none;"></textarea>
              <span id="createDescriptionError" class="field-error"></span>
            </div>

            <div id="createEventMsg"></div>

            <button id="createEventBtn" type="submit" class="primary-btn">Tạo sự kiện (bản nháp)</button>
          </form>
        </section>

        <section class="card">
          <h2>Danh sách sự kiện của bạn</h2>
          <div id="eventsListContainer">
            <p class="muted">Đang tải danh sách sự kiện...</p>
          </div>
        </section>
      </div>

      <!-- VIEW 2: Chi tiết & Sửa sự kiện, Quản lý suất diễn -->
      <div id="detailView" style="display: none;">
        <div style="margin-bottom: 16px;">
          <a href="/organizer-events.html" id="backToListLink" class="menu-link" style="display: inline-block; width: auto; padding: 8px 16px;">← Quay lại danh sách sự kiện</a>
        </div>

        <div id="forbiddenMessage" class="message error" style="display: none; margin-bottom: 20px;">
          Bạn không có quyền xem sự kiện này
        </div>

        <div id="detailContent">
          <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h2 style="margin: 0;">Chỉnh sửa sự kiện</h2>
              <span id="eventStatusBadge" class="badge"></span>
            </div>

            <form id="editEventForm" class="auth-form" novalidate>
              <div class="field-group">
                <label for="editTitle">Tên sự kiện *</label>
                <input id="editTitle" name="title" type="text" maxlength="200" required />
                <span id="editTitleError" class="field-error"></span>
              </div>

              <div class="field-group">
                <label for="editVenue">Địa điểm *</label>
                <input id="editVenue" name="venue" type="text" maxlength="255" required />
                <span id="editVenueError" class="field-error"></span>
              </div>

              <div class="field-group">
                <label for="editDescription">Mô tả</label>
                <textarea id="editDescription" name="description" rows="3" maxlength="5000" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 14px; outline: none;"></textarea>
                <span id="editDescriptionError" class="field-error"></span>
              </div>

              <div id="editEventMsg"></div>

              <div class="actions-row">
                <button id="saveEventBtn" type="submit" class="primary-btn" style="flex: 2;">Lưu thay đổi</button>
                <button id="deleteEventBtn" type="button" class="danger-btn" style="flex: 1; padding: 13px 16px; font-size: 15px;">Xoá sự kiện</button>
              </div>
            </form>
          </section>

          <section class="card">
            <h2>Quản lý suất diễn</h2>

            <div id="showtimeWarning" class="message warning" style="display: none; margin-bottom: 16px;"></div>

            <form id="addShowtimeForm" class="auth-form" novalidate style="margin-bottom: 24px;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="field-group">
                  <label for="showtimeStartsAt">Thời điểm bắt đầu (giờ VN) *</label>
                  <input id="showtimeStartsAt" name="starts_at" type="datetime-local" required />
                  <span id="showtimeStartsAtError" class="field-error"></span>
                </div>

                <div class="field-group">
                  <label for="showtimeRoomName">Phòng / Khán phòng (tùy chọn)</label>
                  <input id="showtimeRoomName" name="room_name" type="text" maxlength="100" placeholder="Ví dụ: Khán phòng A" />
                  <span id="showtimeRoomNameError" class="field-error"></span>
                </div>
              </div>

              <div id="addShowtimeMsg"></div>

              <button id="addShowtimeBtn" type="submit" class="primary-btn">Thêm suất diễn</button>
            </form>

            <h3>Danh sách suất diễn đã tạo</h3>
            <div id="showtimesListContainer">
              <p class="muted">Chưa có suất diễn nào.</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="./api.js"></script>
    <script src="./eventForm.js"></script>
    <script src="./organizer-events.js"></script>
  </body>
</html>
