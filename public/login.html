<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <div class="brand-block">
          <div class="brand-icon" aria-hidden="true">A</div>
          <h1 id="login-title">Đăng nhập</h1>
          <p>Quản lý và mua vé sự kiện</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="example@email.com"
              required
            />
          </div>

          <div class="field-group">
            <label for="password">Mật khẩu</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>

          <div id="messageBox" class="message error" role="alert" aria-live="polite" hidden></div>

          <button id="submitButton" class="primary-btn" type="submit">Đăng nhập</button>
        </form>

        <p class="footer-text">
          Chưa có tài khoản?
          <a href="/register.html">Đăng ký</a>
        </p>
      </section>
    </main>

    <script src="./login.js" defer></script>
  </body>
</html>
