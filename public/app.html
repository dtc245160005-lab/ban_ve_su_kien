<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang chính</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="siteHeader"></div>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="page-title">
        <div class="brand-block">
          <div class="brand-icon" aria-hidden="true">V</div>
          <h1 id="page-title">Trang chính</h1>
          <p id="userSummary">Đang kiểm tra phiên đăng nhập...</p>
        </div>

        <nav id="roleNavigation" class="menu-list" aria-label="Chức năng theo vai trò">
          <!-- Quản lý sự kiện: chỉ hiện cho organizer và admin -->
          <div id="eventManagementSection" class="menu-item" style="display: none;">
            <a href="/organizer-events.html" class="menu-link" id="eventManagementLink">Quản lý sự kiện</a>
          </div>

          <!-- Đối soát: chỉ hiện cho accountant và admin -->
          <div id="reconciliationSection" class="menu-item" style="display: none;">
            <a href="/accountant.html" class="menu-link" id="reconciliationLink">Đối soát</a>
          </div>

          <!-- Soát vé: checker và admin -->
          <div id="ticketCheckSection" class="menu-item" style="display: none;">
            <a href="/checker.html" class="menu-link" id="ticketCheckLink">Soát vé</a>
          </div>

          <!-- Vé của tôi: buyer -->
          <div id="buyerSection" class="menu-item" style="display: none;">
            <a href="/buyer.html" class="menu-link" id="buyerLink">Khu vực người mua</a>
          </div>

          <div id="staffManagementSection" class="menu-item" style="display: none;">
            <a href="/admin-staff.html" class="menu-link" id="staffManagementLink">Quản lý nhân viên</a>
          </div>
        </nav>

        <button id="logoutButton" class="secondary-btn" type="button">Đăng xuất</button>
      </section>
    </main>

    <script src="./api.js"></script>
    <script src="./site-header.js"></script>
    <script src="./menu.js"></script>
    <script>
      const summary = document.getElementById('userSummary');
      const logoutButton = document.getElementById('logoutButton');
      const eventManagementSection = document.getElementById('eventManagementSection');
      const reconciliationSection = document.getElementById('reconciliationSection');
      const ticketCheckSection = document.getElementById('ticketCheckSection');
      const buyerSection = document.getElementById('buyerSection');
      const staffManagementSection = document.getElementById('staffManagementSection');

      async function loadSession() {
        const response = await apiFetch('/api/auth/session');
        if (!response.ok) {
          return;
        }

        const result = await response.json();
        const user = result.user || {};
        const roles = Array.isArray(user.roles) ? user.roles : [];

        summary.textContent = `Tài khoản: ${user.email || user.userId || ''} (Vai trò: ${roles.join(', ') || 'Chưa có'})`;

        // Gọi hàm thuần visibleMenus(), không tự viết điều kiện if theo vai trò ở giao diện
        const activeMenus = visibleMenus(roles);

        if (eventManagementSection) {
          eventManagementSection.style.display = activeMenus.includes('Quản lý sự kiện') ? 'block' : 'none';
        }

        if (reconciliationSection) {
          reconciliationSection.style.display = activeMenus.includes('Đối soát') ? 'block' : 'none';
        }

        if (ticketCheckSection) {
          ticketCheckSection.style.display = activeMenus.includes('Soát vé') ? 'block' : 'none';
        }

        if (buyerSection) {
          buyerSection.style.display = activeMenus.includes('Vé của tôi') ? 'block' : 'none';
        }
        if (staffManagementSection) {
          staffManagementSection.style.display = activeMenus.includes('Quản lý nhân viên') ? 'block' : 'none';
        }
      }

      logoutButton.addEventListener('click', async () => {
        await apiFetch('/api/auth/logout', { method: 'POST' });
        window.location.replace('/login.html');
      });

      loadSession().catch(() => {});
    </script>
  </body>
</html>
