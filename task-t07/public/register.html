<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventTicket - Đăng ký tài khoản</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="page-glow glow-one"></div>
    <div class="page-glow glow-two"></div>

    <div class="auth-shell">
      <div class="auth-panel">
        <aside class="left-side">
          <div class="orb orb-one"></div>
          <div class="orb orb-two"></div>
          <div class="sparkles" aria-hidden="true">
            <span class="spark s1"></span>
            <span class="spark s2"></span>
            <span class="spark s3"></span>
            <span class="spark s4"></span>
            <span class="spark s5"></span>
          </div>

          <div class="promo-badge">VIP ACCESS</div>
          <h2>Tạo tài khoản mới</h2>
          <p class="hero-description">
            Tham gia để trải nghiệm các dịch vụ nhanh chóng, an toàn và tiện lợi
            hơn.
          </p>

          <ul class="feature-list">
            <li class="feature-item">
              <span class="feature-icon" aria-hidden="true">🌐</span>
              <span>Hệ thống đặt ghế thông minh &amp; trực quan</span>
            </li>
            <li class="feature-item">
              <span class="feature-icon" aria-hidden="true">🎟️</span>
              <span>Giao dịch bán vé siêu tốc, an toàn</span>
            </li>
            <li class="feature-item">
              <span class="feature-icon" aria-hidden="true">🛡️</span>
              <span>Bảo mật &amp; đảm bảo vị trí sự kiện</span>
            </li>
          </ul>

          <div class="scene" aria-hidden="true">
            <div class="radar-panel">
              <div class="radar-ring ring-1"></div>
              <div class="radar-ring ring-2"></div>
              <div class="radar-ring ring-3"></div>
              <div class="radar-dot"></div>
              <div class="radar-check"><span>✓</span></div>
            </div>

            <div class="prism-panel">
              <span class="prism prism-a"></span>
              <span class="prism prism-b"></span>
              <span class="prism prism-c"></span>
            </div>
          </div>
        </aside>

        <main class="auth-card">
          <div
            class="logo-wrapper"
            style="
              display: flex;
              justify-content: center;
              align-items: center;
              margin-bottom: 20px;
            "
          >
            <div
              style="
                width: 140px;
                height: 140px;
                border-radius: 50%;
                background: #ffffff;
                display: flex;
                justify-content: center;
                align-items: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
              "
            >
              <svg
                width="130"
                height="130"
                viewBox="0 0 240 240"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="120"
                  cy="120"
                  r="115"
                  stroke="#1B2B48"
                  stroke-width="2.5"
                  fill="none"
                />

                <defs>
                  <linearGradient
                    id="exactTGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%"
                  >
                    <stop offset="0%" stop-color="#3B1261" />
                    <stop offset="60%" stop-color="#255182" />
                    <stop offset="100%" stop-color="#1E7B9A" />
                  </linearGradient>

                  <linearGradient
                    id="exactChairGrad"
                    x1="0%"
                    y1="0%"
                    x2="0%"
                    y2="100%"
                  >
                    <stop offset="0%" stop-color="#311962" />
                    <stop offset="100%" stop-color="#214A7A" />
                  </linearGradient>
                </defs>

                <path
                  d="M 38 45 H 102 V 68 H 63 V 82 H 92 V 104 H 63 V 122 H 102 V 145 H 38 V 45 Z"
                  fill="#2B125B"
                />
                <path
                  d="M 38 100 C 38 128, 62 145, 90 145 H 63 C 45 145, 38 130, 38 100 Z"
                  fill="#2B125B"
                />

                <path
                  d="M 112 118 C 104 110, 100 100, 100 90 C 100 78, 108 70, 118 70 C 127 70, 134 77, 134 86 C 134 98, 120 110, 106 122 L 95 132 C 90 136, 88 141, 94 145 C 100 148, 110 146, 120 138 L 132 145 C 120 152, 100 154, 90 146 C 82 140, 84 128, 92 120 L 112 102 C 108 96, 106 91, 106 86 C 106 80, 110 76, 116 76 C 122 76, 126 80, 126 86 C 126 92, 120 100, 112 108 Z"
                  fill="#3B1261"
                />
                <path
                  d="M 124 130 L 140 145 H 128 L 116 134 Z"
                  fill="#3B1261"
                />

                <rect
                  x="124"
                  y="45"
                  width="70"
                  height="22"
                  rx="2"
                  fill="url(#exactTGrad)"
                />
                <circle cx="159" cy="56" r="8" fill="#FFFFFF" />
                <rect
                  x="150"
                  y="74"
                  width="18"
                  height="32"
                  rx="5"
                  fill="url(#exactChairGrad)"
                />
                <path
                  d="M 142 98 H 148 V 110 H 144 C 142 110, 142 104, 142 98 Z"
                  fill="url(#exactChairGrad)"
                />
                <path
                  d="M 176 98 H 170 V 110 H 174 C 176 110, 176 104, 176 98 Z"
                  fill="url(#exactChairGrad)"
                />
                <rect
                  x="142"
                  y="108"
                  width="34"
                  height="4"
                  rx="1"
                  fill="url(#exactChairGrad)"
                />
                <path
                  d="M 155 112 V 120 H 163 V 112"
                  stroke="url(#exactChairGrad)"
                  stroke-width="3"
                  fill="none"
                />
                <path
                  d="M 148 120 H 170 V 124 H 148 Z"
                  fill="url(#exactChairGrad)"
                />

                <text
                  x="120"
                  y="182"
                  text-anchor="middle"
                  font-family="'Arial', 'Helvetica', sans-serif"
                  font-weight="900"
                  font-size="19"
                  letter-spacing="1"
                  fill="#1B2B48"
                >
                  EVENTTICKET
                </text>
              </svg>
            </div>
          </div>

          <div class="register-header" style="text-align: center">
            <h1 style="margin-bottom: 4px">Đăng ký</h1>
          </div>

          <form id="registerForm" class="auth-form" novalidate>
            <div class="form-group-item" data-field="fullName">
              <label class="form-label-custom" for="fullName">Họ tên</label>
              <div class="custom-input-group">
                <i class="fa-solid fa-user"></i>
                <input
                  id="fullName"
                  name="fullName"
                  type="text"
                  placeholder="Nhập họ tên của bạn"
                  required
                  minlength="2"
                  maxlength="50"
                  aria-invalid="false"
                />
              </div>
              <div
                id="fullNameError"
                class="field-feedback"
                aria-live="polite"
                role="alert"
              ></div>
            </div>

            <div class="form-group-item" data-field="email">
              <label class="form-label-custom" for="email">Email</label>
              <div class="custom-input-group">
                <i class="fa-solid fa-envelope"></i>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="example@email.com"
                  required
                  minlength="5"
                  maxlength="100"
                  aria-invalid="false"
                />
              </div>
              <div
                id="emailError"
                class="field-feedback"
                aria-live="polite"
                role="alert"
              ></div>
            </div>

            <div class="form-group-item" data-field="passwordInput">
              <label class="form-label-custom" for="passwordInput"
                >Mật khẩu</label
              >
              <div class="custom-input-group password-wrap">
                <i class="fa-solid fa-lock"></i>
                <input
                  id="passwordInput"
                  name="password"
                  type="password"
                  placeholder="Nhập mật khẩu tối thiểu 8 ký tự"
                  required
                  minlength="8"
                  maxlength="64"
                  aria-invalid="false"
                />
                <i
                  class="fa-solid fa-eye toggle-password"
                  id="togglePassword"
                  title="Hiện/Ẩn mật khẩu"
                  aria-label="Hiện mật khẩu"
                ></i>
              </div>
              <div
                id="passwordInputError"
                class="field-feedback"
                aria-live="polite"
                role="alert"
              ></div>
            </div>

            <div class="form-group-item" data-field="confirmPasswordInput">
              <label class="form-label-custom" for="confirmPasswordInput"
                >Xác nhận mật khẩu</label
              >
              <div class="custom-input-group password-wrap">
                <i class="fa-solid fa-lock"></i>
                <input
                  id="confirmPasswordInput"
                  name="confirmPassword"
                  type="password"
                  placeholder="Nhập lại mật khẩu"
                  required
                  minlength="8"
                  maxlength="64"
                  aria-invalid="false"
                />
                <i
                  class="fa-solid fa-eye toggle-password"
                  id="toggleConfirmPassword"
                  title="Hiện/Ẩn mật khẩu"
                  aria-label="Hiện mật khẩu xác nhận"
                ></i>
              </div>
              <div
                id="confirmPasswordInputError"
                class="field-feedback"
                aria-live="polite"
                role="alert"
              ></div>
            </div>

            <div
              id="errorBox"
              class="message error"
              role="alert"
              aria-live="polite"
              hidden
            ></div>

            <button id="submitButton" type="submit" class="btn-submit-register">
              Đăng ký
            </button>

            <div
              id="successMsg"
              role="alert"
              aria-live="polite"
              style="
                display: none;
                color: #10b981;
                font-weight: 600;
                font-size: 14px;
                text-align: center;
                margin-top: 10px;
                align-items: center;
                justify-content: center;
                gap: 6px;
              "
            >
              <i class="fa-solid fa-circle-check"></i>
              <span>Đăng ký thành công !</span>
            </div>
          </form>

          <p class="footer-text">
            Đã có tài khoản? <a href="/login.html">Đăng nhập</a>
          </p>
        </main>
      </div>
    </div>

    <script>
      const fieldNames = [
        "fullName",
        "email",
        "passwordInput",
        "confirmPasswordInput",
      ];
      const form = document.getElementById("registerForm");
      const errorBox = document.getElementById("errorBox");
      const successMsg = document.getElementById("successMsg");
      const submitButton = document.getElementById("submitButton");
      const passwordInput = document.getElementById("passwordInput");
      const confirmPasswordInput = document.getElementById(
        "confirmPasswordInput",
      );
      const togglePasswordButton = document.getElementById("togglePassword");
      const toggleConfirmPasswordButton = document.getElementById(
        "toggleConfirmPassword",
      );

      const validators = {
        fullName: (value) => {
          const clean = value.trim();
          if (clean.length < 2 || clean.length > 50) {
            return "Họ tên phải từ 2 đến 50 ký tự.";
          }
          return "";
        },
        email: (value) => {
          const clean = value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean)) {
            return "Email không hợp lệ.";
          }
          return "";
        },
        passwordInput: (value) => {
          if (value.length < 8 || value.length > 64) {
            return "Mật khẩu phải từ 8 đến 64 ký tự.";
          }
          return "";
        },
        confirmPasswordInput: (value) => {
          if (value !== passwordInput.value) {
            return "Xác nhận mật khẩu không khớp.";
          }
          return "";
        },
      };

      function clearFieldErrors() {
        fieldNames.forEach((fieldName) => setFieldState(fieldName, ""));
      }

      function setFieldState(fieldName, message = "") {
        const input = document.getElementById(fieldName);
        const fieldWrap = input?.closest(".custom-input-group");
        const feedback = document.getElementById(`${fieldName}Error`);

        if (!input || !fieldWrap || !feedback) return;

        if (message) {
          fieldWrap.classList.add("invalid");
          input.setAttribute("aria-invalid", "true");
          feedback.textContent = message;
          feedback.classList.add("show");
          feedback.hidden = false;
        } else {
          fieldWrap.classList.remove("invalid");
          input.setAttribute("aria-invalid", "false");
          feedback.textContent = "";
          feedback.classList.remove("show");
          feedback.hidden = true;
        }
      }

      function validateField(fieldName) {
        const input = document.getElementById(fieldName);
        if (!input) return true;

        const message = validators[fieldName]
          ? validators[fieldName](input.value)
          : "";
        setFieldState(fieldName, message);
        return !message;
      }

      function validateForm() {
        return fieldNames.every((fieldName) => validateField(fieldName));
      }

      function hideGlobalError() {
        errorBox.textContent = "";
        errorBox.hidden = true;
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
        if (successMsg) successMsg.style.display = "none";
      }

      function showSuccess(message) {
        if (successMsg) {
          successMsg.innerHTML = `
            <i class="fa-solid fa-circle-check"></i>
            <span>${message}</span>
          `;
          successMsg.style.display = "flex";
        }
        hideGlobalError();
      }

      function mapApiErrorToField(result) {
        const fields = result?.fields || {};
        const message = String(result?.message || "");

        if (fields.fullName) return { field: "fullName", message: fields.fullName };
        if (fields.email) return { field: "email", message: fields.email };
        if (fields.password) return { field: "passwordInput", message: fields.password };
        if (fields.confirmPassword) return { field: "confirmPasswordInput", message: fields.confirmPassword };

        if (/email/i.test(message)) return { field: "email", message };
        if (/họ tên|full name|fullName/i.test(message)) return { field: "fullName", message };
        if (/mật khẩu|password/i.test(message)) return { field: "passwordInput", message };
        if (/xác nhận|confirm/i.test(message)) return { field: "confirmPasswordInput", message };

        return null;
      }

      fieldNames.forEach((fieldName) => {
        const input = document.getElementById(fieldName);
        input.addEventListener("input", () => {
          if (fieldName === "confirmPasswordInput") {
            validateField(fieldName);
            return;
          }

          if (input.value.trim() === "") {
            setFieldState(fieldName, "");
            return;
          }
          validateField(fieldName);
        });
      });

      function setupPasswordToggle(toggleId, inputId) {
        const toggleBtn = document.getElementById(toggleId);
        const inputField = document.getElementById(inputId);

        if (toggleBtn && inputField) {
          toggleBtn.addEventListener("click", function (e) {
            e.preventDefault();
            const isPassword = inputField.getAttribute("type") === "password";
            inputField.setAttribute("type", isPassword ? "text" : "password");
            this.classList.toggle("fa-eye", !isPassword);
            this.classList.toggle("fa-eye-slash", isPassword);
          });
        }
      }

      setupPasswordToggle("togglePassword", "passwordInput");
      setupPasswordToggle("toggleConfirmPassword", "confirmPasswordInput");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        clearFieldErrors();
        hideGlobalError();
        if (successMsg) successMsg.style.display = "none";

        const isValid = validateForm();
        if (!isValid) {
          return;
        }

        const payload = {
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("passwordInput").value,
          confirmPassword: document.getElementById("confirmPasswordInput")
            .value,
        };

        submitButton.disabled = true;
        submitButton.textContent = "Đang xử lý...";

        try {
          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const contentType = response.headers.get("content-type") || "";
          if (!contentType.includes("application/json")) {
            const text = await response.text();
            throw new Error(text || "Máy chủ trả về phản hồi không hợp lệ.");
          }

          const result = await response.json();

          if (!response.ok) {
            const mappedError = mapApiErrorToField(result);

            if (mappedError) {
              setFieldState(mappedError.field, mappedError.message);
            }

            throw new Error(result.message || "Đăng ký thất bại.");
          }

          showSuccess(result.message || "Đăng ký thành công.");
          form.reset();
          clearFieldErrors();

          setTimeout(() => {
            window.location.href = "/login.html";
          }, 1200);
        } catch (error) {
          const hasVisibleFieldError = Array.from(
            document.querySelectorAll(".field-feedback.show"),
          ).some((el) => el.textContent.trim());

          if (!hasVisibleFieldError) {
            // Không hiển thị thông báo chung dưới form.
          }
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Đăng ký";
        }
      });
    </script>
  </body>
</html>
